name: Build and Publish Docker Image (Tag)

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre releases (e.g. v0.0.17-dev) must not replace latest
      - name: Check release type
        run: |
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "LATEST=true" >> "$GITHUB_ENV"
          else
            echo "LATEST=false" >> "$GITHUB_ENV"
          fi

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:${TAG} .

          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:${TAG} \
            ghcr.io/thehsi-hq/comitasbotj:${TAG}

          if [ "$LATEST" = "true" ]; then
            docker tag \
              ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:${TAG} \
              ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:latest

            docker tag \
              ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:${TAG} \
              ghcr.io/thehsi-hq/comitasbotj:latest
          fi

      - name: Push Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:${TAG}
          if [ "$LATEST" = "true" ]; then
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:latest
          fi

      - name: Push GHCR
        run: |
          docker push ghcr.io/thehsi-hq/comitasbotj:${TAG}
          if [ "$LATEST" = "true" ]; then
            docker push ghcr.io/thehsi-hq/comitasbotj:latest
          fi