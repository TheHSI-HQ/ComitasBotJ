name: Build and Publish Docker Image (Tag)

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:${TAG} .

          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:${TAG} \
            ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:latest

          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:${TAG} \
            ghcr.io/thehsi-hq/comitasbotj:${TAG}

          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:${TAG} \
            ghcr.io/thehsi-hq/comitasbotj:latest

      - name: Push Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:${TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/comitasbotj:latest

      - name: Push GHCR
        run: |
          docker push ghcr.io/thehsi-hq/comitasbotj:${TAG}
          docker push ghcr.io/thehsi-hq/comitasbotj:latest