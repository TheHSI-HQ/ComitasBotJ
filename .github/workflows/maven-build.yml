name: Build ComitasBotJ

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build core + plugin
        run: |
          mvn -pl comitas-core -am clean package -DskipTests
          mvn -pl example-plugin -am clean package -DskipTests

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: comitas-core
          path: comitas-core/target/comitas-core-*.jar

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-plugin
          path: example-plugin/target/*.jar
