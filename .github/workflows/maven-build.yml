name: Build ComitasBotJ

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build core + plugin
        run: |
          mvn -pl comitas-core -am clean package -DskipTests
          mvn -pl example-plugin -am clean package -DskipTests

      - name: Verify core JAR
        run: |
          JAR=$(find comitas-core/target -maxdepth 1 -type f -name 'comitas-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Core JAR not found"
            exit 1
          fi

          echo "Running $JAR --version"
          java -jar "$JAR" --version

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: comitas-core
          path: comitas-core/target/comitas-core-*.jar

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-plugin
          path: example-plugin/target/*.jar