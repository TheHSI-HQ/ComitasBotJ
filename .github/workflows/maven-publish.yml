name: Publish to Maven Central

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.0.16)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Set up Java and Maven credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set Maven version from release tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mvn --batch-mode versions:set \
            -DnewVersion="$VERSION" \
            -DgenerateBackupPoms=false

      - name: Build and sign
        run: mvn --batch-mode --no-transfer-progress -pl comitas-api -am clean verify -DskipTests -Prelease-signing
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Assemble and upload bundle
        run: |
          D="bundle/cloud/thehsi/ComitasBotJ/comitas-api/$VERSION"
          mkdir -p "$D"

          T=comitas-api/target
          cp $T/comitas-api-$VERSION{.jar,-sources.jar,-javadoc.jar}{,.asc} "$D/"
          cp comitas-api/.flattened-pom.xml "$D/comitas-api-$VERSION.pom"
          cp $T/comitas-api-$VERSION.pom.asc "$D/"

          for f in "$D"/*; do
            md5sum  "$f" | cut -d' ' -f1 > "$f.md5"
            sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
          done

          (cd bundle && zip -r ../central-bundle.zip .)
          unzip -l central-bundle.zip

          TOKEN=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $TOKEN" \
            -F bundle=@central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=comitas-api-$VERSION"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}