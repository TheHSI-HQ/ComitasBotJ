name: Count Java Lines

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count-lines:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Count Java lines
        run: |
          files=$(find . -name "*.java" | wc -l)
          lines=$(find . -name "*.java" -print0 | xargs -0 cat | wc -l)

          echo "Java files: $files"
          echo "Total lines: $lines"

          {
            echo "## Source Code Statistics"
            echo
            echo "| Metric | Value |"
            echo "|-------:|------:|"
            echo "| Java files | $files |"
            echo "| Total lines | $lines |"
          } >> "$GITHUB_STEP_SUMMARY"