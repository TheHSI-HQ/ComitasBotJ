services:
  comitas:
    image: thehsi/comitasbotj:latest
    restart: always
    container_name: "comitas"
    volumes:
      - ./plugins:/srv/plugins
      - ./server.properties:/srv/server.properties
      # Bot token, plugin data, plugin permissions and plugin files
      - ./data:/srv/data
      # - ./logs:/srv/logs
    # The following allow `docker attach comitas` to work
    stdin_open: true
    tty: true
