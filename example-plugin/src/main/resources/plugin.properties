# Example Plugin Properties File

# Plugin Name
name=ExamplePlugin

# Plugin Version
version=1.0

# Plugin UUID (used for persistent data storage) [Generator](https://www.uuidgenerator.net/version4)
uuid=d152236f-96df-4be1-8f2b-6738c4194ed7

# Plugin Main Class
main=cloud.thehsi.ExamplePlugin.Main

# Plugin's target API version (0.0.8/0.0.8-0.0.9)
api-target=${comitas.version}

# Permissions the plugin requests (network, file_storage), the server owner is asked on install
permissions=file_storage
permission.file_storage.reason=Example Permission
permission.file_storage.required=true
# permission.network.reason=Why the plugin needs network access